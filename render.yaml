# Render Blueprint: lab rehberinin web surumu (statik site)
# Render > New > Blueprint > bu repoyu secin.
services:
  - type: web
    name: aes-workshop-v2
    runtime: static
    buildCommand: echo "Statik site, derleme gerekmiyor"
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
